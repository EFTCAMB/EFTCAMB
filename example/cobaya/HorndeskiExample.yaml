output:  /your/output/path

theory:
  camb:
    ignore_obsolete: true
    # Here is the parameters one want them to be varied.
    requires:
    - Horndeskic00
    - Horndeskic01
    - Horndeskic20
    - Horndeskic30
    - Horndeski_phi_ini
    # Here must point to the the root directory of EFTCAMB.
    path: /your/path/to/EFTCAMB
    # Here put all EFTCAMB configuration flags and fixed parameters which are not varied in the sampling.
    extra_args:
      lens_potential_accuracy: 0
      nonlinear: 0
      dark_energy_model: EFTCAMB
      EFTflag: 5
      Horndeski_designer_V: false
      Horndeski_model: 7
      Horndeski_freefunc0_model: 11
      Horndeski_freefunc1_model: 0
      Horndeski_freefunc2_model: 1
      Horndeski_freefunc3_model: 3
      Horndeskic3Exp: 2
      Horndeski_freefunc4_model: 0
      Horndeski_freefunc5_model: 0
      Horndeski_freefunc6_model: 0
      Horndeski_parameter_number: 0
      Horndeski_model_specific_ic: false
      Horndeski_phidot_ini: 0
      Horndeski_evolve_hubble: false
      Horndeski_shooting: false
      model_background_num_points: 10000
      model_background_a_ini: 1e-14
      Horndeski_a_pertcutoff_before: 1e-14
      EFTCAMB_turn_on_time: 1e-8
      EFTCAMB_use_background: true
      EFTCAMB_evolve_delta_phi: true
      EFTCAMB_evolve_metric_h: false
      EFTCAMB_skip_stability: true
      num_massive_neutrinos: 1
      mnu: 0.06
      nnu: 3.044
  # If one wants to shoot some parameters in Horndeski modual, it's useful to make a new theory part here.
  tg_xboxphi_shoot:
    # The path of shoot function
    python_path: ./
    # The path of EFTCAMB.
    cosmo_path: /your/path/to/EFTCAMB

likelihood:
  sn.pantheonplus: null
  bao.desi_dr2: null
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_NPIPE_highl_CamSpec.TTTEEE: null
  planckpr4lensing: null


sampler:
   polychord:
     nprior: 40nlive
     num_repeats: 10d
     precision_criterion: 0.01
 # mcmc:
 #   learn_proposal: True
 #   oversample_power: 0.4
 #   proposal_scale: 1.9
 #   Rminus1_stop: 0.01

params:
  ###########################
  ## Standard cosmo params ##
  ###########################
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref:
      dist: norm
      loc: 3.05
      scale: 0.001
    proposal: 0.001
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  ns:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 60
      max: 80
    ref:
      dist: norm
      loc: 67
      scale: 2
    proposal: 2
    latex: H_0
  ombh2:
    prior:
      min: 0.01
      max: 0.03
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omch2:
    prior:
      min: 0.05
      max: 0.2
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
  tau:
    prior:
      min: 0.01
      max: 0.1
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  omegam:
    latex: \Omega_\mathrm{m}
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  YHe:
    latex: Y_\mathrm{P}
  Y_p:
    latex: Y_P^\mathrm{BBN}
  DHBBN:
    derived: 'lambda DH: 10**5*DH'
    latex: 10^5 \mathrm{D}/\mathrm{H}
  zrei:
    latex: z_\mathrm{re}
  sigma8:
    latex: \sigma_8
  S8:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5'
    latex: S_8
  A:
    derived: 'lambda As: 1e9*As'
    latex: 10^9 A_\mathrm{s}
  clamp:
    derived: 'lambda As, tau: 1e9*As*np.exp(-2*tau)'
    latex: 10^9 A_\mathrm{s} e^{-2\tau}
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  rdrag:
    latex: r_\mathrm{drag}
  thetastar:
    latex: \theta_*

  #################################
  ## Horndeski module parameters ##
  #################################
  logOmega0:
    prior:
      min: -4
      max: -0.5
    ref:
      dist: norm
      loc: -1.45231
      scale: 0.1
    proposal: 0.05
    drop: true
    latex: \log_{10}|\Omega_0|
  logxi:
    prior:
      min: -4
      max: 1
    ref:
      dist: norm
      loc: -0.3
      scale: 0.1
    proposal: 0.05
    drop: true
    latex: \log_{10}\xi
  zeta:
    prior:
      min: 0
      max: 10
    ref:
      dist: norm
      loc: 0
      scale: 0.5
    proposal: 0.1
    drop: true
    latex: \zeta
  Horndeskic20:
    value: 'lambda zeta: zeta*1e-6'
  Horndeskic00:
    latex: V_0
  Horndeskic01:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    proposal: 0.1
    latex: \lambda
  Horndeskic30:
    value: 'lambda logxi: -10**logxi'
  Horndeski_phi_ini:
    value: 'lambda logxi, logOmega0: -np.sqrt(10**logOmega0/10**logxi)'
    latex: \phi_\mathrm{ini}
