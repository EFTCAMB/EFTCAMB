#---------------------------------------------------------------------------------------------------
# RPH (EFTflag = 2, AltParEFTmodel = 1): power-law Planck-mass and kineticity functions.
# Point: old test ini 3_RPH_MK_power_1.
# Turn-on 1e-06: change against 1e-08 = 9.5e-06 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 1.7e-01.
# The turn-on prints the pi initial-condition regularisation warnings for some k (no stable quasi-static attractor
# there): the turn-on is converged, so the initial conditions do not matter at the 1e-4 level.
#---------------------------------------------------------------------------------------------------

EFTflag = 2
AltParEFTmodel = 1
RPHmassPmodel = 3
RPHkineticitymodel = 3
RPHmassP0 = 0.1
RPHmassPExp = 0.5
RPHkineticity0 = 0.1
RPHkineticityExp = -2.0

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-6
output_root = eftcamb_test/results/spectra_results/3_RPH_MK_power

DEFAULT(base_params.ini)
