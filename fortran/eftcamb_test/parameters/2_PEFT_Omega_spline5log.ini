#---------------------------------------------------------------------------------------------------
# Pure EFT (EFTflag = 1): Omega as a quintic spline in log a and log Omega (form 10, Logx and Logy flags, order 5).
# Point: constructed here (no paper point).
# Turn-on 1e-03: change against 1e-08 = 3.2e-06 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 1.5e+00.
# Omega is the null value 0 below the first node a = 1e-4. The nodes are not a power law, which the log-log spline
# reproduces exactly.
#---------------------------------------------------------------------------------------------------

EFTflag = 1
PureEFTmodel = 1
PureEFTmodelOmega = 10
EFTOmega_Logx_Flag = T
EFTOmega_Logy_Flag = T
EFTOmega_Spline_Order = 5
EFTOmega_Spline_Pixels = 6
EFTOmega_null_value = 0.0
EFTOmegax1 = 1.e-4
EFTOmegax2 = 1.e-3
EFTOmegax3 = 1.e-2
EFTOmegax4 = 0.1
EFTOmegax5 = 0.5
EFTOmegax6 = 1.0
EFTOmegav1 = 1.e-8
EFTOmegav2 = 1.e-6
EFTOmegav3 = 2.e-4
EFTOmegav4 = 3.e-2
EFTOmegav5 = 0.3
EFTOmegav6 = 0.8

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-3
output_root = eftcamb_test/results/spectra_results/2_PEFT_Omega_spline5log

DEFAULT(base_params.ini)
