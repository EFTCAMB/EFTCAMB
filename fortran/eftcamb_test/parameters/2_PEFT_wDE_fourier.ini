#---------------------------------------------------------------------------------------------------
# Pure EFT (EFTflag = 1): w_DE as a Fourier series in a (EFTwDE = 7, cos and sin orders 1).
# Point: constructed here (no paper point).
# Turn-on 1e-02: change against 1e-08 = 7.6e-05 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 2.2e-01.
# The Fourier form is tested on w_DE: a Fourier Omega has Omega' = 0 somewhere in (0, 1), where the pi kinetic term of
# a pure-Omega model vanishes.
#---------------------------------------------------------------------------------------------------

EFTflag = 1
PureEFTmodel = 1
EFTwDE = 7
EFTw_Fourier_order_cos = 1
EFTw_Fourier_order_sin = 1
EFTw_a0 = -0.8
EFTw_phase = 0.0
EFTw_a1 = 0.1
EFTw_b1 = 0.05

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-2
output_root = eftcamb_test/results/spectra_results/2_PEFT_wDE_fourier

DEFAULT(base_params.ini)
