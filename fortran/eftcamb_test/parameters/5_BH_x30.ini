#---------------------------------------------------------------------------------------------------
# beyond Horndeski (EFTflag = 4, FullMappingEFTmodel = 5), x30 = 3.
# Point: constructed here (no paper point).
# Turn-on 1e-05: change against 1e-08 = 6.7e-06 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 7.9e-01.
# The background starts at the module default 1/(1.5e5 + 1) and is defined by its initial conditions there (moving it
# changes the model by up to 0.8): the turn-on is the first decade after it, checked against earlier turn-ons with the
# background frozen below it. The turn-on prints the pi initial-condition regularisation warnings for some k (no stable
# quasi-static attractor there): the turn-on is converged, so the initial conditions do not matter at the 1e-4 level.
#---------------------------------------------------------------------------------------------------

EFTflag = 4
FullMappingEFTmodel = 5
Beyond_Horndeski_x10 = -0.1
Beyond_Horndeski_x30 = 3.0
Beyond_Horndeski_x40 = 1.0

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-5
output_root = eftcamb_test/results/spectra_results/5_BH_x30

DEFAULT(base_params.ini)
