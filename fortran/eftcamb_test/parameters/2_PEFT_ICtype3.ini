#---------------------------------------------------------------------------------------------------
# Pure EFT (EFTflag = 1): constant Omega = 1 with EFT_IC_type = 3 (radiation-era series initial conditions).
# Point: old test ini 2_PEFT_Omega_const_1.
# Turn-on 1e-07: change against 1e-08 = 3.3e-07 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 1.5e+01.
# Cross-check: it must equal 2_PEFT_Omega_const (9e-7). The series is not valid at the highest k at the turn-on, which
# use type 1 (warning). Identical to 2_PEFT_ICtype2: types 2 and 3 differ only through the gamma functions (also with
# gamma1 = 1).
#---------------------------------------------------------------------------------------------------

EFTflag = 1
PureEFTmodel = 1
PureEFTmodelOmega = 1
EFTOmega0 = 1.0
EFT_IC_type = 3

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-7
output_root = eftcamb_test/results/spectra_results/2_PEFT_ICtype3

DEFAULT(base_params.ini)
