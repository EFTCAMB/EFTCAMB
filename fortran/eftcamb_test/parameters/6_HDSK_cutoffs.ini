#---------------------------------------------------------------------------------------------------
# Horndeski module (EFTflag = 5), model 7, delta_phi path, non-default perturbation cutoffs and kinetic term:
# Horndeski_a_pertcutoff_after = 0.5 (delta_phi coefficients replaced by Hubble friction after a = 0.5),
# Horndeski_hubble_friction = 3, Horndeski_min_rel_timescale = 1e-4 (no effect on the spectra: the time scale it sets
# is not used), Horndeski_kinetic_coeff = 1.5 (G2 = 1.5 X - ...). TG_1 point otherwise, c00 re-shot for H0 = 67.5.
# Turn-on 1e-6: change vs 1e-11 = 1.4e-5 (1e-5: 3.8e-3). dev from GR = 0.22. No warning.
#---------------------------------------------------------------------------------------------------
EFTflag = 5
EFTCAMB_evolve_delta_phi = T
Horndeski_model = 7
Horndeski_freefunc0_model = 11
Horndeski_freefunc1_model = 0
Horndeski_freefunc2_model = 0
Horndeski_freefunc3_model = 3
Horndeski_freefunc4_model = 0
Horndeski_freefunc5_model = 0
Horndeski_freefunc6_model = 0
Horndeski_parameter_number = 0
Horndeski_model_specific_ic = F
Horndeski_evolve_hubble = F
Horndeski_shooting = F
Horndeskic3Exp = 2
Horndeskic00 = 2.956311e-08
Horndeskic01 = 0.4
Horndeskic30 = -0.005
Horndeski_phi_ini = -3.162
Horndeski_phidot_ini = 0
model_background_num_points = 60000
Horndeski_a_pertcutoff_before = 1e-8
Horndeski_a_pertcutoff_after = 0.5
Horndeski_hubble_friction = 3
Horndeski_min_rel_timescale = 1e-4
Horndeski_kinetic_coeff = 1.5

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-6
output_root = eftcamb_test/results/spectra_results/6_HDSK_cutoffs

DEFAULT(base_params.ini)
