#---------------------------------------------------------------------------------------------------
# GR reference (EFTflag = 0): the base cosmology with EFTCAMB off, set explicitly (it is also the code default).
# Every model header quotes its deviation from GR against these spectra. IntTolBoost = 2 is the value every EFT run
# forces on the perturbation integrator: with it 2_PEFT_wDE_LCDM and 5_QUINT_LCDM, which reach the same cosmology
# through the EFT equations, reproduce these spectra to 1.3e-6 (with the CAMB default 1 the tensor C_l differed by
# 1.4e-3).
#---------------------------------------------------------------------------------------------------

EFTflag = 0
IntTolBoost = 2

output_root = eftcamb_test/results/spectra_results/1_GR

DEFAULT(base_params.ini)
