#---------------------------------------------------------------------------------------------------
# Horndeski module (EFTflag = 5), model 1 (power-law quintessence G2 = X - V0 phi^n - Lambda), pi path.
# Point: the inverse power law of the quintessence full-mapping test (5_quint_inverse_power: V = U phi^-1,
# U = 3 H0^2 (1 - Omega_c - Omega_b - Omega_nu) = 1.01215e-7 Mpc^-2), Lambda = 0, field at rest, phi_ini shot for
# H0 = 67.5 (0.724749; the full-mapping code shoots 0.7247). Agrees with 5_quint_inverse_power to 3e-6 at equal turn-on.
# Turn-on 1e-1 (the latest decade): change vs 1e-11 = 4.0e-5. dev from GR = 0.13. No warning.
#---------------------------------------------------------------------------------------------------
EFTflag = 5
Horndeski_model = 1
Horndeski_param1 = 1.01215e-07
Horndeski_param2 = -1
Horndeski_param3 = 0
Horndeski_evolve_hubble = F
Horndeski_phi_ini = 0.7247492
Horndeski_phidot_ini = 0
model_background_num_points = 60000

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-1
output_root = eftcamb_test/results/spectra_results/6_HDSK_powerlaw_quint

DEFAULT(base_params.ini)
