#---------------------------------------------------------------------------------------------------
# Horndeski module (EFTflag = 5), model 7, delta_phi path, Horndeski check flags: check_positivity_bound = T,
# check_Meff = F, check_rapid_evolution = F. TG_1 point of 6_HDSK_TG_dphi: bit-identical spectra (the positivity
# bounds hold trivially for TG, c_ss = c_sst = 0; a G2 X^2 or G3 X term to make them non-trivial breaks the
# background at early times, where X is large in Mpc units).
# Turn-on 1e-6: change vs 1e-11 = 4.2e-5 (1e-5: 3.8e-3). dev from GR = 0.24. No warning.
#---------------------------------------------------------------------------------------------------
