#---------------------------------------------------------------------------------------------------
# Horndeski module (EFTflag = 5), model 7 (parameterized Horndeski, leading order in X), delta_phi path:
# thawing gravity (Ye, arXiv:2411.11743; Ye, Martinelli, Hu, Silvestri, PRL 134, 181002): G2 = X - c00 exp(-c01 phi),
# G4 = 1/2 + c30 phi^2 (Horndeski_freefunc0_model = 11, freefunc3_model = 3), field at rest at phi_ini.
# Point: old test 5_hdsk_TG_1 (xi = -c30 = 0.005, Omega_0 = xi phi_ini^2 = 0.05, lambda = c01 = 0.4);
# c00 re-shot (Horndeski_shooting) for H0 = 67.5 with the base parameters (the old c00 gives H0 = 85.5).
# The background starts at the module default a = 1e-14 (the old 1e-10 start is refused by the stability check, now on:
# numerical noise of the EFT functions at its first point, a = 1e-10).
# Energy constraint for H (Horndeski_evolve_hubble = F). Turn-on 1e-6: change vs turn-on 1e-11 = 4.2e-5 (1e-5: 3.8e-3).
# dev from GR = 0.24. No warning.
#---------------------------------------------------------------------------------------------------
EFTflag = 5
EFTCAMB_evolve_delta_phi = T
Horndeski_model = 7
Horndeski_freefunc0_model = 11
Horndeski_freefunc1_model = 0
Horndeski_freefunc2_model = 0
Horndeski_freefunc3_model = 3
Horndeski_freefunc4_model = 0
Horndeski_freefunc5_model = 0
Horndeski_freefunc6_model = 0
Horndeski_parameter_number = 0
Horndeski_model_specific_ic = F
Horndeski_evolve_hubble = F
Horndeski_shooting = F
Horndeskic3Exp = 2
Horndeskic00 = 3.235688e-08
Horndeskic01 = 0.4
Horndeskic30 = -0.005
Horndeski_phi_ini = -3.162
Horndeski_phidot_ini = 0
model_background_num_points = 60000
Horndeski_a_pertcutoff_before = 1e-8

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-6
output_root = eftcamb_test/results/spectra_results/6_HDSK_TG_dphi

DEFAULT(base_params.ini)
