#---------------------------------------------------------------------------------------------------
# Horndeski module (EFTflag = 5), model 3 (EDE: G2 = X - V0 phi^4 - Lambda, G3 = xi X), delta_phi path
# (the field oscillates: the pi path is refused).
# Point constructed here (no paper point in the code/docs): phi_ini = 0.7 at rest, V0 = 1e4 Mpc^-2, xi = -2e-4 Mpc^2,
# Lambda shot for H0 = 67.5. Peak EDE fraction 0.24 at z = 2970 (0.12 at z = 3660 without xi). xi > 0 fails the
# background (rapid evolution) and xi <= -1e-3 has a gradient instability; dev grows with |xi| (2.2 at -8e-4).
# Turn-on 1e-5: change vs 1e-11 = 3.0e-7 (1e-4: 2.0e-3). dev from GR = 1.0. No warning.
#---------------------------------------------------------------------------------------------------
EFTflag = 5
EFTCAMB_evolve_delta_phi = T
Horndeski_model = 3
Horndeski_param1 = -2e-4
Horndeski_param2 = 1e4
Horndeski_param3 = 1.011971e-07
Horndeski_evolve_hubble = F
Horndeski_phi_ini = 0.7
Horndeski_phidot_ini = 0
model_background_num_points = 60000

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-5
output_root = eftcamb_test/results/spectra_results/6_HDSK_EDE_XboxPhi

DEFAULT(base_params.ini)
