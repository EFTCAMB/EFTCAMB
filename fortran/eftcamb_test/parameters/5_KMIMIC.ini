#---------------------------------------------------------------------------------------------------
# K-mouflage, mimic branch (Kmimic = T).
# Point: old test ini 5_Kmimic_3.
# Turn-on 1e-08: change against 1e-10 = 2.4e-05 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 3.9e-01.
# omnuh2 = 0: massive neutrinos are not implemented for K-mouflage. The background starts at 1e-12: with the default
# 1e-9 the turn-on 1e-8 sits in its initial transient (8e-4). The turn-on prints the pi initial-condition
# regularisation warnings for some k (no stable quasi-static attractor there): the turn-on is converged, so the initial
# conditions do not matter at the 1e-4 level.
#---------------------------------------------------------------------------------------------------

EFTflag = 4
omnuh2 = 0.0
FullMappingEFTmodel = 3
Kmimic = T
alphaU = 0.2
gammaU = 1.0
m = 3.0
eps2_0 = 0.001
gammaA = 5.0
model_background_a_ini = 1e-12
model_background_num_points = 13400

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-8
output_root = eftcamb_test/results/spectra_results/5_KMIMIC

DEFAULT(base_params.ini)
