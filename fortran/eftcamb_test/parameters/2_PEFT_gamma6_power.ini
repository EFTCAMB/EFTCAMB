#---------------------------------------------------------------------------------------------------
# Pure EFT (EFTflag = 1) beyond GLPV: power-law gamma6 on the power-law Omega point (gamma6 alone changes k <= 0.1/Mpc
# by 3.5e-5).
# Point: old test ini 2_PEFT_gamma6_power_1 plus Omega.
# Turn-on 1e-03: change against 1e-08 = 9.9e-05 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 4.1e-01.
# beyond GLPV: the code has no physical ghost/gradient conditions for it ('stability for model beyond GLPV has not been
# worked out'), so EFT_ghost_stability and EFT_gradient_stability are off and the mathematical ghost check is on.
#---------------------------------------------------------------------------------------------------

EFTflag = 1
PureEFTmodel = 1
PureEFTmodelOmega = 3
EFTOmega0 = 1.0
EFTOmegaExp = 2.0
PureEFTmodelGamma6 = 3
EFTGamma60 = 1.0
EFTGamma6Exp = 0.1
EFT_ghost_stability = F
EFT_gradient_stability = F
EFT_ghost_math_stability = T

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-3
output_root = eftcamb_test/results/spectra_results/2_PEFT_gamma6_power

DEFAULT(base_params.ini)
