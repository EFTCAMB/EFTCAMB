#---------------------------------------------------------------------------------------------------
# RPH (EFTflag = 2, AltParEFTmodel = 1): power-law Planck mass, kineticity and braiding (alpha_B = -0.3 a).
# Point: constructed here (no paper point).
# Turn-on 1e-05: change against 1e-08 = 1.2e-05 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 3.7e-01.
# Positive braiding is unstable. Replaces the old braiding inis (MB_OmegaDE too stiff, MB_const runaway). The turn-on
# prints the pi initial-condition regularisation warnings for some k (no stable quasi-static attractor there): the
# turn-on is converged, so the initial conditions do not matter at the 1e-4 level.
#---------------------------------------------------------------------------------------------------

EFTflag = 2
AltParEFTmodel = 1
RPHmassPmodel = 3
RPHmassP0 = 0.2
RPHmassPExp = 1.0
RPHkineticitymodel = 3
RPHkineticity0 = 1.0
RPHkineticityExp = 1.0
RPHbraidingmodel = 3
RPHbraiding0 = -0.3
RPHbraidingExp = 1.0

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-5
output_root = eftcamb_test/results/spectra_results/3_RPH_MKB_power

DEFAULT(base_params.ini)
