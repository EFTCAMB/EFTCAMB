#---------------------------------------------------------------------------------------------------
# Horndeski module (EFTflag = 5), model 7, pi path, Horndeski_designer_V = T: the potential is
# reconstructed for w_DE = -0.7 (Horndeski_wDE_model = 1, constant). All free functions zero (c1 = 0 and no G4(phi):
# the designer equations hold only where the coefficient of phi'' in the second Friedmann equation vanishes; with
# G4 = 1/2 + c phi^2 the background solver fails at the first step), i.e. a designed quintessence.
# Background from 1e-10 (from the default 1e-14 the backward integration stops on rapid background evolution;
# a start at 1e-5 changes the spectra by 7e-4). Point constructed here; dev 0.11 / 0.25 / 0.45 for w = -0.9/-0.8/-0.7.
# Turn-on 1e-2: change vs 1e-7 = 2.1e-5 (1e-1: 5.1e-3; a turn-on of 1e-8 fails in the perturbation integrator).
# dev from GR = 0.45. No warning.
#---------------------------------------------------------------------------------------------------
EFTflag = 5
Horndeski_model = 7
Horndeski_designer_V = T
Horndeski_wDE_model = 1
HorndeskiwDE0 = -0.7
Horndeski_freefunc0_model = 0
Horndeski_freefunc1_model = 0
Horndeski_freefunc2_model = 0
Horndeski_freefunc3_model = 0
Horndeski_freefunc4_model = 0
Horndeski_freefunc5_model = 0
Horndeski_freefunc6_model = 0
Horndeski_parameter_number = 0
Horndeski_model_specific_ic = F
Horndeski_evolve_hubble = F
Horndeski_shooting = F
model_background_a_ini = 1e-10
model_background_num_points = 60000

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-2
output_root = eftcamb_test/results/spectra_results/6_HDSK_designer_V

DEFAULT(base_params.ini)
