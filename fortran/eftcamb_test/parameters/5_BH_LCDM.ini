#---------------------------------------------------------------------------------------------------
# beyond Horndeski (EFTflag = 4, FullMappingEFTmodel = 5) on an LCDM background (want_LCDM = T: x3 = x4 = 0, x1 and x2
# from Omega_DE).
# Point: constructed here (no paper point).
# Turn-on 1e-05: change against 1e-08 = 3.7e-07 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 1.2e-05.
# The LCDM initial conditions are shot on Omega_DE today (H0 recovered to 1e-12, also with massive neutrinos): with
# w_DE = -1 and a zero scalar sound speed the model is GR (TT, EE within 2e-6 of EFTflag = 0 at the same IntTolBoost),
# a consistency test of the beyond Horndeski equations. The gradient check refuses its zero gradient term at roundoff
# (-5e-40), so it is off (the ghost check stays on). The background starts at the module default 1/(1.5e5 + 1): the
# turn-on is the first decade after it, checked against earlier turn-ons with the background frozen below it.
#---------------------------------------------------------------------------------------------------

EFTflag = 4
FullMappingEFTmodel = 5
want_LCDM = T
EFT_gradient_stability = F

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-5
output_root = eftcamb_test/results/spectra_results/5_BH_LCDM

DEFAULT(base_params.ini)
