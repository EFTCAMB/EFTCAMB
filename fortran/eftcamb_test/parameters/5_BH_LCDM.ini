#---------------------------------------------------------------------------------------------------
# beyond Horndeski (EFTflag = 4, FullMappingEFTmodel = 5) on an LCDM background (want_LCDM = T: x3 = x4 = 0, x1 and x2
# from Omega_DE).
# Point: constructed here (no paper point).
# Turn-on 1e-05: change against 1e-08 = 3.2e-06 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 4.6e-01.
# The scalar sound speed is zero: the gradient check refuses its gradient term at roundoff (-5e-40), so it is off (the
# ghost check stays on). omnuh2 = 0: with massive neutrinos the LCDM initial conditions miss H0 by 5% (0.26% without
# them). The background starts at the module default 1/(1.5e5 + 1) and is defined by its initial conditions there
# (moving it changes the model by up to 0.8): the turn-on is the first decade after it, checked against earlier
# turn-ons with the background frozen below it.
#---------------------------------------------------------------------------------------------------

EFTflag = 4
FullMappingEFTmodel = 5
want_LCDM = T
omnuh2 = 0.0
EFT_gradient_stability = F

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-5
output_root = eftcamb_test/results/spectra_results/5_BH_LCDM

DEFAULT(base_params.ini)
