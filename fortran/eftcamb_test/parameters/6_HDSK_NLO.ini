#---------------------------------------------------------------------------------------------------
# Horndeski module (EFTflag = 5), model 8 (parameterized Horndeski, next to leading order in X), delta_phi path:
# G2 = X - c00 exp(-phi) + c7 X^3, G3 = c8 X^2, G4 = 1/2 + c9 X^2, G5 = c10 X^2 (constant c7..c10), field at rest at
# phi_ini = -3.162 (minimal coupling in phi, so X ~ 0 early). G5X /= 0 needs Horndeski_evolve_hubble = T; background
# from 1e-12 (from 1e-14 the stability check is refused by noise at a ~ 3e-10 with the evolved H).
# Point constructed here: each of c7 = 1e15, c8 = 1e14, c9 = 1e13, c10 = 1e21 (Mpc units) alone changes the spectra
# by 0.7-2.3e-2; c00 shot for H0 = 67.5. Larger values freeze the field (dev falls).
# Turn-on 1e-1 (the latest decade): change vs 1e-10 = 5.2e-5. dev from GR = 0.074. No warning.
#---------------------------------------------------------------------------------------------------
EFTflag = 5
EFTCAMB_evolve_delta_phi = T
Horndeski_model = 8
Horndeski_freefunc0_model = 11
Horndeski_freefunc1_model = 0
Horndeski_freefunc2_model = 0
Horndeski_freefunc3_model = 0
Horndeski_freefunc4_model = 0
Horndeski_freefunc5_model = 0
Horndeski_freefunc6_model = 0
Horndeski_freefunc7_model = 1
Horndeski_freefunc8_model = 1
Horndeski_freefunc9_model = 1
Horndeski_freefunc10_model = 1
Horndeski_parameter_number = 0
Horndeski_model_specific_ic = F
Horndeski_evolve_hubble = T
Horndeski_shooting = F
Horndeskic00 = 5.043527e-09
Horndeskic01 = 1.0
Horndeskic70 = 1e15
Horndeskic80 = 1e14
Horndeskic90 = 1e13
Horndeskic100 = 1e21
Horndeski_phi_ini = -3.162
Horndeski_phidot_ini = 0
model_background_a_ini = 1e-12
model_background_num_points = 60000
Horndeski_a_pertcutoff_before = 1e-8

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-1
output_root = eftcamb_test/results/spectra_results/6_HDSK_NLO

DEFAULT(base_params.ini)
