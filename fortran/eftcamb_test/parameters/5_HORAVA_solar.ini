#---------------------------------------------------------------------------------------------------
# Horava (EFTflag = 4, FullMappingEFTmodel = 1), solar-system branch.
# Point: old test ini 5_Horava_SolSyst_3.
# Turn-on 1e-06: change against 1e-08 = 1.9e-06 (rule <= 1e-4 at k <= 0.1/Mpc); deviation from GR = 3.4e+00.
# beyond GLPV: the code has no physical ghost/gradient conditions for it ('stability for model beyond GLPV has not been
# worked out'), so EFT_ghost_stability and EFT_gradient_stability are off and the mathematical ghost check is on. The
# model priors (arXiv:1508.01787) apply.
#---------------------------------------------------------------------------------------------------

EFTflag = 4
FullMappingEFTmodel = 1
HoravaSolarSystem = T
Horava_lambda = 0.1
Horava_eta = 0.1
EFT_ghost_stability = F
EFT_gradient_stability = F
EFT_ghost_math_stability = T

EFTCAMB_write_background = T
EFTCAMB_turn_on_time = 1e-6
output_root = eftcamb_test/results/spectra_results/5_HORAVA_solar

DEFAULT(base_params.ini)
