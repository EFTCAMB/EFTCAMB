repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types:
          - python
      - id: end-of-file-fixer
        exclude_types:
          - python
      - id: check-added-large-files
        # EFTCAMB MOD START: the generated Horndeski perturbation coefficients are ~1.4 MB of Fortran
        exclude: ^(docs/changelog/hyperspherical_bessels\.pdf|fortran/eftcamb/08f_full_models/008p0_Horndeski_perturbation_coefficients\.f90)$
        # original code:
        # exclude: ^docs/changelog/hyperspherical_bessels\.pdf$
        # EFTCAMB MOD END
      - id: check-merge-conflict

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        exclude: ^docs/ScalEqs\.ipynb$

  - repo: https://github.com/cmbant/forformat-pre-commit
    rev: v0.1.4
    hooks:
      - id: forformat
        # EFTCAMB MOD START: keep the Doxygen markers of the EFTCAMB sources (see pyproject.toml)
        exclude: ^(forutils|fortran/eftcamb|fortran/eftcamb_apps)/
        # original code:
        # exclude: ^forutils/
        # EFTCAMB MOD END
